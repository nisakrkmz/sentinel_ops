services:
  - type: web
    name: sentinel-ops
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_MAX_THREADS
        value: 3
      - key: DATABASE_PATH
        value: /rails/storage/production.sqlite3
